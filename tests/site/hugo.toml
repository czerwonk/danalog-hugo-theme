baseURL = "https://example.org/"
title = "Fixture"
locale = "en"
theme = "gallery"
disableKinds = ["taxonomy"]

[params]
  defaultTheme = "dark"
  banner = "images/banner.svg"
  bannerWidth = 600
  bannerHeight = 150
  [params.socialIcons]
    mastodon = "https://mastodon.example/@me"
  [params.gallery]
    borderSize = 8
    strokeSize = 1
    borderColor = "#ffffff"
    strokeColor = "#000000"

[imaging.meta]
  sources = ["exif"]
  fields = ["DateTimeOriginal", "ImageDescription", "Make", "Model", "UserComment", "LensMake", "LensModel"]

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]
