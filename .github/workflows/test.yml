name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Same version as theme.toml min_version; raise both together
      HUGO_VERSION: 0.168.0
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - name: Install Dart Sass
        # Native Dart Sass from the npm registry (same layout as the GitHub release); the snap store is not
        # always reachable from runners. Version and checksum pinned: update both together.
        working-directory: ${{ runner.temp }}
        env:
          DART_SASS_VERSION: 1.100.0
          DART_SASS_SHA256: 6b435cdd4953bd8919fb4046abb1b604aadbe7e86bc40f1d3710cabfc56f3026
        run: |
          tgz="sass-embedded-linux-x64-${DART_SASS_VERSION}.tgz"
          curl -fsSLO "https://registry.npmjs.org/sass-embedded-linux-x64/-/$tgz"
          echo "$DART_SASS_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz"
          echo "$PWD/package/dart-sass" >>"$GITHUB_PATH"
      - name: Install Hugo
        working-directory: ${{ runner.temp }}
        run: |
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -fsSLO "$base/$deb"
          curl -fsSL "$base/hugo_${HUGO_VERSION}_checksums.txt" | grep " $deb\$" | sha256sum -c -
          sudo dpkg -i "$deb"
      - name: Install packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: tests/run.sh
      - name: Build example site
        working-directory: exampleSite
        # Built for GitHub Pages (project page), deployed by the job below on pushes to main
        run: hugo --panicOnWarning --minify --baseURL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" --destination "${{ runner.temp }}/example"
      - name: Upload example site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/example

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy example site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
