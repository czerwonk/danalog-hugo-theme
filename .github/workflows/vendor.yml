name: Vendored files

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Check vendored files match package.json versions
        run: npm run vendor -- --check
