version: 2
updates:
  # Vendored runtime libraries (dependencies) and dev tooling. After a runtime bump,
  # run "npm run vendor" on the PR branch; the "Vendored files" check fails until then.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
